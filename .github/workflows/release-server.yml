name: release-server

# Publishes `aaa-server` to PyPI when a GitHub Release tagged server-vX.Y.Z is published (Trusted Publishing, no token stored).
# aaa-server is versioned and released independently of the library (release.yml handles v* tags).
# One-time setup: create the `aaa-server` project on PyPI with a pending trusted publisher for this repository,
# workflow `release-server.yml`, environment `pypi-server`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'server-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      already_published: ${{ steps.exists.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Tag, version and dependency floor agree
        run: |
          uv run --no-project python - <<'PY'
          import os, tomllib
          meta = tomllib.load(open("packages/aaa-server/pyproject.toml", "rb"))["project"]
          tag = os.environ.get("GITHUB_REF_NAME", "")
          if os.environ.get("GITHUB_EVENT_NAME") == "release" and tag != "server-v" + meta["version"]:
              raise SystemExit(f"release tag {tag!r} does not match aaa-server version {meta['version']!r}")
          core = [d for d in meta["dependencies"] if d.startswith("autonomous-agent-architecture")]
          if any("dev" in d for d in core):
              raise SystemExit(f"the dependency on the library is still a development floor: {core}")
          PY
      - name: Is this version already on PyPI?
        id: exists
        run: |
          version="$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('packages/aaa-server/pyproject.toml','rb'))['project']['version'])")"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/aaa-server/${version}/json")"
          if [ "$code" = "200" ]; then echo "published=true" >> "$GITHUB_OUTPUT"; else echo "published=false" >> "$GITHUB_OUTPUT"; fi
      - run: uv build --package aaa-server
      - run: uvx twine check --strict dist/*
      - name: The built wheel installs from PyPI's library and runs
        run: |
          uv venv /tmp/smoke --python 3.12
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/aaa-server serve --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AAA_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check . && uv run pyright
      - run: uv run pytest -v -p no:cacheprovider tests/server

  publish-pypi:
    if: github.event_name == 'release' && needs.build.outputs.already_published != 'true'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi-server
      url: https://pypi.org/p/aaa-server
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
