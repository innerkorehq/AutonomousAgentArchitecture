name: release

# Publishes to PyPI when a GitHub Release is published, using PyPI "Trusted Publishing" (OIDC): no API
# token is stored in this repository. One-time setup is described in docs/about/contributing.md.
#
#   * publish a GitHub Release tagged vX.Y.Z   -> builds, verifies, publishes to PyPI
#   * run manually (workflow_dispatch)         -> builds, verifies, publishes to TestPyPI (a dry run)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # aaa-server has its own tags (server-v*) and its own workflow, release-server.yml.
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'server-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      already_published: ${{ steps.exists.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Tag matches the package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag '$GITHUB_REF_NAME' does not match pyproject version '$version'"
            exit 1
          fi
      - name: Is this version already on PyPI?
        id: exists
        run: |
          version="$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/autonomous-agent-architecture/${version}/json")"
          if [ "$code" = "200" ]; then echo "published=true" >> "$GITHUB_OUTPUT"; echo "::notice::$version is already on PyPI; the publish step will be skipped"; else echo "published=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata and README rendering
        run: uvx twine check --strict dist/*
      - name: The built wheel installs and runs in a clean environment
        run: |
          uv venv /tmp/smoke --python 3.12
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -I examples/quickstart.py | grep -q "success - 17 x 23 = 391"
          /tmp/smoke/bin/python -I -c "import aaa; print('aaa', aaa.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    # The release gate: the same checks as CI, on the commit being released.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: aaa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AAA_TEST_POSTGRES_URL: postgresql://postgres:aaa@localhost:5432/postgres
      AAA_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check . && uv run pyright
      - run: uv run pytest -v -p no:cacheprovider -o faulthandler_timeout=120

  publish-pypi:
    if: github.event_name == 'release' && needs.build.outputs.already_published != 'true'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/autonomous-agent-architecture
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/autonomous-agent-architecture
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
