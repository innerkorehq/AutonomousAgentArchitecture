[project]
name = "autonomous-agent-architecture"
version = "0.5.0"
description = "AAA, Autonomous Agent Architecture: the architecture and runtime for autonomous agents. Build, orchestrate, execute, recover, manage."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Innerkore Technologies" }]
keywords = ["agents", "llm", "asyncio", "event-sourcing", "workflow", "tool-calling", "react", "planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "anyio>=4.4", "httpx>=0.27"]

[project.optional-dependencies]
litellm = ["litellm"]
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]
# Memory backends (aaa.memory). Supermemory needs none: it is plain HTTP over httpx.
mem0 = ["mem0ai>=2.0"]
graphiti = ["graphiti-core>=0.30"]
langgraph = ["langgraph>=1.0"]
langmem = ["langgraph>=1.0", "langmem>=0.0.30"]
# Observability (aaa.observe): OTLP/HTTP covers Langfuse, LangSmith and Phoenix; the sinks are presets over it.
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30", "opentelemetry-semantic-conventions>=0.50b0"]
langfuse = ["autonomous-agent-architecture[otel]"]
langsmith = ["autonomous-agent-architecture[otel]"]
phoenix = ["autonomous-agent-architecture[otel]"]
# Eval libraries (aaa.eval.*). Only autoevals is light enough to lock; deepeval, ragas and inspect-ai are installed by hand
# (see the evals guide) because they are large and pin LangChain/pydantic/protobuf versions that clash with each other.
# autoevals imports the openai package even when you hand it another client, but does not declare it
autoevals = ["autoevals>=0.0.100", "openai>=1.0"]
# Vector stores (aaa.vector). pgvector uses asyncpg (same driver as the Postgres event store) and the `vector` extension in your database.
pgvector = ["asyncpg>=0.29"]
qdrant = ["qdrant-client>=1.9"]
sqlitevec = ["sqlite-vec>=0.1.6"]
lancedb = ["lancedb>=0.20", "pyarrow"]
chroma = ["chromadb>=1.0"]
# SDK 10 needs nothing more; SDK 7.x needs its own `pinecone[asyncio]` extra for the async client
pinecone = ["pinecone>=7"]
# Guardrail adapters (aaa.guard.*). Presidio, Guardrails AI and NeMo Guardrails are large and are installed by hand (see the guardrails guide).
bedrock = ["boto3>=1.35"]
# Document ingestion (aaa.ingest): PDFs. Everything else in ingestion uses the standard library.
pdf = ["pypdf>=4"]
mcp-config = ["pyyaml>=6"]  # read MCP server configurations written as YAML (JSON and TOML need nothing)
browser = ["playwright>=1.40"]  # aaa.env.browser: a browser as an environment (then: playwright install chromium)
mcp = ["mcp>=1.21.2,<3"]  # MCP client (aaa.mcp); works with both the 1.x and 2.x SDK
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.scripts]
aaa = "aaa.cli:main"

[project.urls]
Homepage = "https://github.com/innerkorehq/AutonomousAgentArchitecture"
Documentation = "https://innerkorehq.github.io/AutonomousAgentArchitecture/"
Source = "https://github.com/innerkorehq/AutonomousAgentArchitecture"
Server = "https://pypi.org/project/aaa-server/"
Issues = "https://github.com/innerkorehq/AutonomousAgentArchitecture/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff", "pyright", "asyncpg>=0.29", "redis>=5.0", "aaa-server[jwt,redis]"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
aaa-server = { workspace = true }

[build-system]
# <1.32: newer hatchling writes core-metadata 2.5, which twine/PyPI do not accept yet.
requires = ["hatchling>=1.27,<1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Recent ruff also formats Python blocks inside Markdown, which mangles the docs' `--8<--` embed markers.
extend-exclude = ["*.md", "docs", "site", "tests/golden"]  # golden files are exact expected output, not source to reformat

[tool.pyright]
# Gate the library, the documented examples and the scripts. Tests are not type-checked: they use
# duck-typed doubles (flaky stores, frozen backends) and deliberately pass invalid arguments.
include = ["src", "examples", "scripts", "packages/aaa-server/src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
